[project]
name = "civic-engagement"
version = "0.1.0"
description = "Civic co-design demonstrator: the core app (API, scene assembly, sessions and scenarios, ingestion)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "geopandas>=1.1.4",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pyproj>=3.7.2",
    "shapely>=2.1.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    # The domain packs, installed alongside the core while they live in this
    # repository (packs/). The core must not import them: see
    # tests/test_package_boundaries.py.
    "bologna-civic-dt",
    "rural-digital-twin",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The core's tests, on a toy pack (tests/toy_pack). Each pack's tests run on
# their own, with their pack: `uv run pytest packs/<pack>/tests`.
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "civic_engagement"
module-root = ""

[tool.uv.workspace]
members = ["packs/*"]

[tool.uv.sources]
bologna-civic-dt = { workspace = true }
rural-digital-twin = { workspace = true }
