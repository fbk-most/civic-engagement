[project]
name = "civic-engagement"
version = "0.1.0"
description = "Civic co-design demonstrator: the core app (API, scene assembly, sessions and scenarios, ingestion)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "geopandas>=1.1.4",
    "numpy",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pyproj>=3.7.2",
    "shapely>=2.1.2",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
# The manager's CLI (civic_engagement/admin.py).
civic-engagement-admin = "civic_engagement.admin:main"

[project.optional-dependencies]
# The state in an S3 bucket (CIVIC_ENGAGEMENT_STATE=s3://...).
s3 = ["boto3>=1.40"]

[dependency-groups]
dev = [
    "boto3>=1.40",
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# On a toy pack (tests/toy_pack): the domain packs, in their own
# repositories, have their own tests.
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "civic_engagement"
module-root = ""
