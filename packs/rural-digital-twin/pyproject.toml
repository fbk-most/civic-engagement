[project]
name = "rural-digital-twin"
version = "0.1.0"
description = "Rural domain pack for civic-engagement: a mountain valley's forest"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "civic-engagement",
    "osmnx>=2.1.0",
    "shapely>=2.1.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rural_digital_twin"
module-root = ""

[tool.uv.sources]
civic-engagement = { workspace = true }
